<svg id="recovery" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="flowchart" style="max-width: 896px; background-color: rgb(24, 24, 24);" viewBox="0 0 896 222" role="graphics-document document" aria-roledescription="flowchart-v2" aria-describedby="chart-desc-recovery" aria-labelledby="chart-title-recovery"><title id="chart-title-recovery">Two repairs with different closure outcomes</title><desc id="chart-desc-recovery">A completes health checks; B restores routing but retains an application failure.</desc><style>#recovery{font-family:Arial;font-size:16px;fill:#ccc;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#recovery .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#recovery .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#recovery .error-icon{fill:#a44141;}#recovery .error-text{fill:#ddd;stroke:#ddd;}#recovery .edge-thickness-normal{stroke-width:1px;}#recovery .edge-thickness-thick{stroke-width:3.5px;}#recovery .edge-pattern-solid{stroke-dasharray:0;}#recovery .edge-thickness-invisible{stroke-width:0;fill:none;}#recovery .edge-pattern-dashed{stroke-dasharray:3;}#recovery .edge-pattern-dotted{stroke-dasharray:2;}#recovery .marker{fill:lightgrey;stroke:lightgrey;}#recovery .marker.cross{stroke:lightgrey;}#recovery svg{font-family:Arial;font-size:16px;}#recovery p{margin:0;}#recovery .label{font-family:Arial;color:#ccc;}#recovery .cluster-label text{fill:#F9FFFE;}#recovery .cluster-label span{color:#F9FFFE;}#recovery .cluster-label span p{background-color:transparent;}#recovery .label text,#recovery span{fill:#ccc;color:#ccc;}#recovery .node rect,#recovery .node circle,#recovery .node ellipse,#recovery .node polygon,#recovery .node path{fill:#1f2020;stroke:#ccc;stroke-width:1px;}#recovery .rough-node