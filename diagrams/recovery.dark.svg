ty:0.5;background-color:hsl(0, 0%, 34.4117647059%);fill:hsl(0, 0%, 34.4117647059%);}#recovery .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#recovery .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#recovery .node .neo-node{stroke:#ccc;}#recovery [data-look="neo"].node rect,#recovery [data-look="neo"].cluster rect,#recovery [data-look="neo"].node polygon{stroke:url(#recovery-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#recovery [data-look="neo"].swimlane.cluster rect{filter:none;}#recovery [data-look="neo"].node path{stroke:url(#recovery-gradient);stroke-width:1px;}#recovery [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#recovery [data-look="neo"].node .neo-line path{stroke:#ccc;filter:none;}#recovery [data-look="neo"].node circle{stroke:url(#recovery-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#recovery [data-look="neo"].node circle .state-start{fill:#000000;}#recovery [data-look="neo"].icon-shape .icon{fill:url(#recovery-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#recovery [data-look="neo"].icon-shape .icon-neo path{stroke:url(#recovery-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#recovery :root{--mermaid-font-family:Arial;}</style><g><marker id="recovery_flowchart-v2-pointEnd" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"/></marker><marker id="recovery_flowchart-v2-pointStart" class="marker flowchart-v2" viewBox="0 0 10 10" refX="4.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 5 L 10 10 L 10 0 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"/></marker><marker id="recovery_flowchart-v2-pointEnd-mar