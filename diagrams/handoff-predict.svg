<svg id="handoff-predict" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="flowchart" style="max-width: 1170.58px; background-color: white;" viewBox="0 0 1170.578125 222" role="graphics-document document" aria-roledescription="flowchart-v2" aria-describedby="chart-desc-handoff-predict" aria-labelledby="chart-title-handoff-predict"><title id="chart-title-handoff-predict">Predict the consequence before inspecting the case</title><desc id="chart-desc-handoff-predict">Compare the prior service state with one declared change and separate request and response checks.</desc><style>#handoff-predict{font-family:Arial;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#handoff-predict .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#handoff-predict .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#handoff-predict .error-icon{fill:#552222;}#handoff-predict .error-text{fill:#552222;stroke:#552222;}#handoff-predict .edge-thickness-normal{stroke-width:1px;}#handoff-predict .edge-thickness-thick{stroke-width:3.5px;}#handoff-predict .edge-pattern-solid{stroke-dasharray:0;}#handoff-predict .edge-thickness-invisible{stroke-width:0;fill:none;}#handoff-predict .edge-pattern-dashed{stroke-dasharray:3;}#handoff-predict .edge-pattern-dotted{stroke-dasharray:2;}#handoff-predict .marker{fill:#333333;stroke:#333333;}#handoff-predict .marker.cross{stroke:#333333;}#handoff-predict svg{font-family:Arial;font-size:16px;}#handoff-predict p{margin:0;}#handoff-predict .label{font-family:Arial;color:#333;}#handoff-predict .cluster-label text{fill:#333;}#handoff-predict .cluster-label span{color:#333;}#handoff-predict .cluster-label span p{background-color:transparent;}#handoff-predict .label text,#handoff-predict sp