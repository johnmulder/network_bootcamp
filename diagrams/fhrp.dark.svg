rt;stroke-width:revert;}#fhrp .node .neo-node{stroke:#ccc;}#fhrp [data-look="neo"].node rect,#fhrp [data-look="neo"].cluster rect,#fhrp [data-look="neo"].node polygon{stroke:url(#fhrp-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#fhrp [data-look="neo"].swimlane.cluster rect{filter:none;}#fhrp [data-look="neo"].node path{stroke:url(#fhrp-gradient);stroke-width:1px;}#fhrp [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#fhrp [data-look="neo"].node .neo-line path{stroke:#ccc;filter:none;}#fhrp [data-look="neo"].node circle{stroke:url(#fhrp-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#fhrp [data-look="neo"].node circle .state-start{fill:#000000;}#fhrp [data-look="neo"].icon-shape .icon{fill:url(#fhrp-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#fhrp [data-look="neo"].icon-shape .icon-neo path{stroke:url(#fhrp-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#fhrp :root{--mermaid-font-family:Arial;}</style><g><marker id="fhrp_flowchart-v2-pointEnd" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"/></marker><marker id="fhrp_flowchart-v2-pointStart" class="marker flowchart-v2" viewBox="0 0 10 10" refX="4.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 5 L 10 10 L 10 0 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"/></marker><marker id="fhrp_flowchart-v2-pointEnd-margin" class="marker flowchart-v2" viewBox="0 0 11.5 14" refX="11.5" refY="7" markerUnits="userSpaceOnUse" markerWidth="10.5" markerHeight="14" orient="auto"><path d="M 0 0 L 11.5 7 L 0 14 z" class="arrowMarkerPath" style="stroke-width: 0; stroke-dasharray: 1, 0;"/></marker><marker id="fhrp_flowchart-v2-pointStart-margin" clas