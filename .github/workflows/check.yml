name: Verify course delivery

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - run: python -B -m unittest discover -s tests -v
      - run: python -B verification/check_delivery.py
      - run: python -B verification/check_llm.py --check
      - run: python -B verification/package_course.py --output work/course.tar.gz --check
      - run: git diff --exit-code

  mac-delivery:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install core tools before offline delivery
        run: ./prerequisites/setup.sh
      - run: python -B verification/check_delivery.py --smoke --journey
      - run: python -B verification/package_course.py --output work/course.tar.gz --journey
      - run: git diff --exit-code
